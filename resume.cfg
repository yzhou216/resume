% TeX4ht configuration for the HTML build of resume.tex

\Preamble{xhtml}

\Configure{TITLE+}{Yiyu Zhou}

% Emit each entry heading as two flex rows so the right column aligns
\renewenvironment{entry}[4]{%
  \ifvmode\IgnorePar\fi\EndP
  \HCode{<div class="entry"><div class="entry-row"><strong>}#1%
  \HCode{</strong><strong>}#2\HCode{</strong></div>}%
  \HCode{<div class="entry-row"><span>}#3%
  \HCode{</span><strong>}#4\HCode{</strong></div>}%
  \begin{itemize}
}{%
  \end{itemize}
  \ifvmode\IgnorePar\fi\EndP
  \HCode{</div>}%
}

\Css{body { max-width: 50em; margin: 2em auto; padding: 0 1em; }}
\Css{h3.likesectionHead {
  margin: 1.5em 0 0.5em;
  font-size: 1em;
  text-transform: uppercase;
  border-bottom: 1px solid;
}}
\Css{.entry { margin-bottom: 0.75em; }}
\Css{.entry-row {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}}
\Css{ul.itemize1 { margin: 0; }}

\begin{document}

\EndPreamble
